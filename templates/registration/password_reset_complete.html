{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete | {{ SYSTEM_NAME }}{% endblock %}

{% block auth_content %}
<div class="auth-page-wrapper auth-page">
    <div class="auth-card text-center">
        <div class="stat-icon success mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.6rem;">
            <i class="bi bi-shield-check"></i>
        </div>
        <h2 class="h4 fw-bold text-dark mb-2">Password Reset Successful</h2>
        <p class="text-secondary small mb-4">
            Your password has been successfully updated. You may now log in with your new credentials.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm">
            Proceed to Login
        </a>
    </div>
</div>
{% endblock %}
