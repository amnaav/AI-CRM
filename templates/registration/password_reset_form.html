{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password | {{ SYSTEM_NAME }}{% endblock %}

{% block auth_content %}
<div class="auth-page-wrapper auth-page">
    <div class="auth-card">
        <div class="text-center mb-4">
            <img src="{% static 'images/logo.svg' %}" alt="AI CRM Logo" width="50" height="50" class="mb-2">
            <h1 class="h4 fw-bold text-dark mb-1">Reset Password</h1>
            <p class="text-secondary small">Enter your verified email address to receive password recovery instructions.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold text-dark">Email Address</label>
                <input type="email" name="email" class="form-control form-control-lg" placeholder="name@example.com" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-2 shadow-sm">
                Send Reset Instructions
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <a href="{% url 'accounts:login' %}" class="text-secondary small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
