{% extends 'base.html' %}
{% load static %}

{% block title %}404 Not Found | {{ SYSTEM_NAME }}{% endblock %}

{% block auth_content %}
<div class="auth-page-wrapper">
    <div class="auth-card text-center">
        <div class="stat-icon warning mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
            <i class="bi bi-question-circle"></i>
        </div>
        <h1 class="display-6 fw-bold text-dark mb-1">404</h1>
        <h5 class="fw-bold text-dark mb-3">Page Not Found</h5>
        <p class="text-secondary small mb-4">
            The requested resource or page could not be located on the AI CRM server.
        </p>
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4">
            <i class="bi bi-house-door me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
