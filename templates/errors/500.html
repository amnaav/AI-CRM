{% extends 'base.html' %}
{% load static %}

{% block title %}500 Server Error | {{ SYSTEM_NAME }}{% endblock %}

{% block auth_content %}
<div class="auth-page-wrapper">
    <div class="auth-card text-center">
        <div class="stat-icon danger mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
            <i class="bi bi-gear-wide-connected"></i>
        </div>
        <h1 class="display-6 fw-bold text-dark mb-1">500</h1>
        <h5 class="fw-bold text-dark mb-3">Internal Server Error</h5>
        <p class="text-secondary small mb-4">
            An unexpected error occurred while processing your request. The issue has been safely logged.
        </p>
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4">
            <i class="bi bi-house-door me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
