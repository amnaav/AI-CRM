{% extends 'base.html' %}
{% load static %}

{% block title %}400 Bad Request | {{ SYSTEM_NAME }}{% endblock %}

{% block auth_content %}
<div class="auth-page-wrapper">
    <div class="auth-card text-center">
        <div class="stat-icon warning mx-auto mb-3" style="width: 64px; height: 64px; font-size: 2rem;">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h1 class="display-6 fw-bold text-dark mb-1">400</h1>
        <h5 class="fw-bold text-dark mb-3">Bad Request</h5>
        <p class="text-secondary small mb-4">
            The server could not understand the request due to invalid or malformed parameters.
        </p>
        <a href="{% url 'dashboard:index' %}" class="btn btn-primary px-4">
            <i class="bi bi-house-door me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
