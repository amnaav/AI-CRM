<div class="card border-0 shadow-sm mb-4">
    <div class="card-body p-3 p-md-4">
        <form method="get" class="row g-2 align-items-center" id="reportFilterForm">
            <!-- Hidden Export Field for Dropdown -->
            <input type="hidden" name="export" id="exportFormatInput" value="">

            <!-- Date Range Presets -->
            <div class="col-12 mb-2">
                <div class="btn-group btn-group-sm flex-wrap w-100" role="group" aria-label="Date Presets">
                    <a href="?preset=all" class="btn {% if active_preset == 'all' or not active_preset %}btn-primary{% else %}btn-outline-secondary{% endif %}">All Time</a>
                    <a href="?preset=today" class="btn {% if active_preset == 'today' %}btn-primary{% else %}btn-outline-secondary{% endif %}">Today</a>
                    <a href="?preset=this_month" class="btn {% if active_preset == 'this_month' %}btn-primary{% else %}btn-outline-secondary{% endif %}">This Month</a>
                    <a href="?preset=last_month" class="btn {% if active_preset == 'last_month' %}btn-primary{% else %}btn-outline-secondary{% endif %}">Last Month</a>
                    <a href="?preset=this_quarter" class="btn {% if active_preset == 'this_quarter' %}btn-primary{% else %}btn-outline-secondary{% endif %}">This Quarter</a>
                    <a href="?preset=this_year" class="btn {% if active_preset == 'this_year' %}btn-primary{% else %}btn-outline-secondary{% endif %}">This Year</a>
                </div>
            </div>

            <!-- Custom Date Inputs -->
            <div class="col-sm-6 col-md-3">
                <label class="form-label small text-muted mb-1">From Date</label>
                <input type="date" name="start_date" class="form-control form-control-sm" value="{{ start_date }}">
            </div>
            <div class="col-sm-6 col-md-3">
                <label class="form-label small text-muted mb-1">To Date</label>
                <input type="date" name="end_date" class="form-control form-control-sm" value="{{ end_date }}">
            </div>

            <!-- Optional Extra Inputs Slot -->
            {% block extra_filters %}{% endblock %}

            <!-- Search Field -->
            <div class="col-sm-6 col-md-3">
                <label class="form-label small text-muted mb-1">Search Keywords</label>
                <input type="text" name="q" class="form-control form-control-sm" placeholder="Search..." value="{{ q }}">
            </div>

            <!-- Action Buttons -->
            <div class="col-sm-6 col-md-3 d-flex align-items-end gap-2 mt-3 mt-md-0">
                <button type="submit" class="btn btn-primary btn-sm flex-grow-1" onclick="document.getElementById('exportFormatInput').value='';">
                    <i class="bi bi-funnel me-1"></i> Apply
                </button>
                <a href="?" class="btn btn-outline-secondary btn-sm" title="Clear Filters">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </a>

                <!-- Export Action Dropdown -->
                <div class="dropdown">
                    <button class="btn btn-outline-success btn-sm dropdown-toggle fw-semibold" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-download me-1"></i> Export
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li>
                            <button type="button" class="dropdown-item d-flex align-items-center" onclick="triggerExport('csv')">
                                <i class="bi bi-filetype-csv text-primary me-2 fs-5"></i> Export CSV (.csv)
                            </button>
                        </li>
                        <li>
                            <button type="button" class="dropdown-item d-flex align-items-center" onclick="triggerExport('xlsx')">
                                <i class="bi bi-file-earmark-excel text-success me-2 fs-5"></i> Export Excel (.xlsx)
                            </button>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <button type="button" class="dropdown-item d-flex align-items-center" onclick="triggerExport('pdf')">
                                <i class="bi bi-file-earmark-pdf text-danger me-2 fs-5"></i> Export PDF Document (.pdf)
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
function triggerExport(format) {
    const form = document.getElementById('reportFilterForm');
    const exportInput = document.getElementById('exportFormatInput');
    exportInput.value = format;
    form.submit();
    setTimeout(() => { exportInput.value = ''; }, 1000);
}
</script>
