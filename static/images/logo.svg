<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield / Hexagon -->
  <polygon points="50,6 88,26 88,74 50,94 12,74 12,26" fill="url(#shieldGrad)" />
  <polygon points="50,12 82,29 82,71 50,88 18,71 18,29" fill="#17153B" />
  
  <!-- AI Neural Network Core Nodes -->
  <line x1="50" y1="30" x2="32" y2="52" stroke="#E4DFF2" stroke-width="2.5" opacity="0.8"/>
  <line x1="50" y1="30" x2="68" y2="52" stroke="#E4DFF2" stroke-width="2.5" opacity="0.8"/>
  <line x1="32" y1="52" x2="50" y2="70" stroke="#C4B5FD" stroke-width="2.5" opacity="0.8"/>
  <line x1="68" y1="52" x2="50" y2="70" stroke="#C4B5FD" stroke-width="2.5" opacity="0.8"/>
  <line x1="32" y1="52" x2="68" y2="52" stroke="#EC4899" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Center Intelligence Node -->
  <circle cx="50" cy="52" r="7" fill="url(#aiGrad)" filter="url(#glow)"/>
  
  <!-- Vertex Nodes -->
  <circle cx="50" cy="30" r="5" fill="#E4DFF2" />
  <circle cx="32" cy="52" r="5" fill="#C4B5FD" />
  <circle cx="68" cy="52" r="5" fill="#EC4899" />
  <circle cx="50" cy="70" r="5" fill="#7C3AED" />
</svg>
